let W = innerWidth, H = innerHeight;

// Data-driven (cars_project): runs, the one ember run, labels, table size and props come from the converted log (viz/convert.py).

/* ---------------- renderer, scene, light */
const R = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
R.setPixelRatio(1); R.setSize(W, H); R.shadowMap.enabled = false;
R.toneMapping = THREE.NoToneMapping; R.outputColorSpace = THREE.SRGBColorSpace;

const S = new THREE.Scene(); S.background = new THREE.Color("#ebe4d7"); S.fog = new THREE.Fog("#ebe4d7", 18 * KS, 36 * KS);
const cam = new THREE.PerspectiveCamera(28, W/H, 0.1, 200);
const ICON_L = new THREE.Vector3(-0.1, 0.78, 0.62).normalize();   // the icons' light (r3d (-0.1,-0.62,0.78) in y-up coordinates)
const sun = new THREE.DirectionalLight("#ffffff", 0.5); sun.position.copy(ICON_L).multiplyScalar(12); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, {left:-12, right:12, top:9, bottom:-9, near:1, far:40}); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03; sun.shadow.radius = 2.5;
S.add(sun); S.add(new THREE.AmbientLight("#ffffff", 2.76));
const MATS = CAR.mats;                                            // the icon palette: light, mid, dark per material
const hex = c => { const v = new THREE.Color(c); return [v.r*255, v.g*255, v.b*255].map(x => x / 255); };
const tonesOf = c => { if (MATS[c]) return MATS[c].map(t => t.map(x => x / 255)); const m = new THREE.Color(c).convertLinearToSRGB ? hex(c) : hex(c);
  return [m.map(x => Math.min(1, x * 1.1)), m, m.map(x => x * 0.86)]; };
const ICON_VS = `varying vec3 vN; void main(){ vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0); }`;
const ICON_FS = `uniform vec3 c0; uniform vec3 c1; uniform vec3 c2; uniform vec3 L; uniform float op; varying vec3 vN;
  void main(){ float l = dot(normalize(vN), L); gl_FragColor = vec4(l > 0.62 ? c0 : (l > 0.18 ? c1 : c2), op); }`;
const _im = {};
function iconMat(c, opacity=1){ const k = c + opacity; if (_im[k]) return _im[k]; const t = tonesOf(c);
  return _im[k] = new THREE.ShaderMaterial({uniforms: {c0: {value: new THREE.Vector3(...t[0])}, c1: {value: new THREE.Vector3(...t[1])}, c2: {value: new THREE.Vector3(...t[2])},
    L: {value: ICON_L}, op: {value: opacity}}, vertexShader: ICON_VS, fragmentShader: ICON_FS, transparent: opacity < 1, toneMapped: false}); }
const mat = (c) => iconMat(c);
const HULL = new THREE.ShaderMaterial({uniforms: {w: {value: 0.006}}, side: THREE.BackSide, toneMapped: false,
  vertexShader: `uniform float w; void main(){ vec4 p = modelMatrix * vec4(position, 1.0); vec3 n = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * vec4(p.xyz + n * w, 1.0); }`,
  fragmentShader: `void main(){ gl_FragColor = vec4(0.086, 0.075, 0.059, 1.0); }`});
const LINEM = new THREE.LineBasicMaterial({color: C.ink, toneMapped: false});
// icon shadow: r3d projects every triangle along the light onto z = 0 and paints it (226,218,203) on paper.
// Here: the same projection in the vertex shader, multiplied onto the ground (so on the road it darkens the road), once per pixel (stencil).
const SHADOW = new THREE.ShaderMaterial({uniforms: {L: {value: ICON_L}}, toneMapped: false, transparent: true, depthWrite: false,
  blending: THREE.MultiplyBlending, premultipliedAlpha: true,
  stencilWrite: true, stencilRef: 1, stencilFunc: THREE.NotEqualStencilFunc, stencilZPass: THREE.ReplaceStencilOp, stencilFail: THREE.KeepStencilOp, stencilZFail: THREE.KeepStencilOp,
  vertexShader: `uniform vec3 L; void main(){ vec4 p = modelMatrix * vec4(position, 1.0); p.xyz -= (max(p.y, 0.0) / L.y) * L; p.y = 0.03; gl_Position = projectionMatrix * viewMatrix * p; }`,
  fragmentShader: `void main(){ gl_FragColor = vec4(226.0/243.0, 218.0/239.0, 203.0/231.0, 1.0); }`});
const basic = c => new THREE.MeshBasicMaterial({color: c, toneMapped: false});
const edges = (mesh) => { const g = new THREE.Group(); g.position.copy(mesh.position); g.rotation.copy(mesh.rotation); g.scale.copy(mesh.scale);
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 37), LINEM)); g.add(new THREE.Mesh(mesh.geometry, HULL)); return g; };
const add = (geo, c, x, y, z, o={}) => { const m = new THREE.Mesh(geo, o.material || mat(c)); m.position.set(x, y, z); (o.parent || S).add(m); if (o.edge) (o.parent || S).add(edges(m));
  if (o.cast !== false){ const sh = new THREE.Mesh(geo, SHADOW); sh.position.copy(m.position); sh.rotation.copy(m.rotation); sh.scale.copy(m.scale); sh.renderOrder = 1; (o.parent || S).add(sh); m.userData.shadow = sh; }
  return m; };

const R3 = (x, y, z) => new THREE.Vector3(x, z, -y);                 // r3d (z up) -> three (y up)
function iconModel(M, scale, mats={}){
  const root = new THREE.Group(), parts = {};
  for (const [name, P] of Object.entries(M.parts)){
    const piv = R3(...P.pivot).multiplyScalar(scale), grp = new THREE.Group(); grp.position.copy(piv); root.add(grp); parts[name] = grp;
    for (const [m, T] of Object.entries(P.mats)){
      const pos = [], nor = [];
      for (let i = 0; i < T.p.length; i += 3){ const v = R3(T.p[i], T.p[i+1], T.p[i+2]).multiplyScalar(scale), n = R3(T.n[i], T.n[i+1], T.n[i+2]); pos.push(v.x, v.y, v.z); nor.push(n.x, n.y, n.z); }

}

/* ---------------- track data -> world (100 px = 1 unit) */
const X = x => (x - 800) / 100, Z = y => (y - 470) / 100;
const cen = D.center.map(p => new THREE.Vector2(X(p[0]), Z(p[1]))), n = cen.length;
const Lft = D.left.map(p => new THREE.Vector2(X(p[0]), Z(p[1]))), Rgt = D.right.map(p => new THREE.Vector2(X(p[0]), Z(p[1])));
const NN = D.N.map(p => new THREE.Vector2(p[0], p[1]));
function distToTrack(x, z){ let m = 1e9; for (let i = 0; i < n; i += 3){ const dx = cen[i].x - x, dz = cen[i].y - z; const d = dx*dx + dz*dz; if (d < m) m = d; } return Math.sqrt(m); }
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* ---------------- the slab: a table model with a visible edge */
add(new THREE.BoxGeometry(SW, 0.5, SD), C.slab, 0, -0.25, 0.1, {cast:false, edge:true});
add(new THREE.BoxGeometry(SW + 0.02, 0.06, SD + 0.02), C.ash2, 0, -0.47, 0.1, {cast:false});
// the table top: flat paper, like the ground under every icon
{ const g = new THREE.PlaneGeometry(SW, SD); g.rotateX(-Math.PI/2); const m = new THREE.Mesh(g, basic(C.paper)); m.position.set(0, 0.002, 0.1); S.add(m); }

/* ---------------- road ribbon, white edge lines, kerbs, start line */
function ribbon(A, B, y, color, o={}){
  const pos = [], idx = [];
  for (let i = 0; i < A.length; i++){ pos.push(A[i].x, y, A[i].y, B[i].x, y, B[i].y); }
  for (let i = 0; i < A.length; i++){ const j = (i + 1) % A.length; idx.push(2*i, 2*j, 2*i+1, 2*i+1, 2*j, 2*j+1); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, o.material || new THREE.MeshBasicMaterial({color, side: THREE.DoubleSide, toneMapped: false})); S.add(m); return m;
}
const off = (k) => cen.map((c, i) => new THREE.Vector2(c.x + NN[i].x * k, c.y + NN[i].y * k));
const hw = D.width / 200;
ribbon(off(hw + 0.035), off(-hw - 0.035), 0.008, C.card);   // white lines under the edge of the asphalt
ribbon(off(hw - 0.012), off(-hw + 0.012), 0.016, C.road);
// kerbs on the outside of bends: alternating ink and paper blocks
{ const geos = {ink: [], paper: []};
  for (let i = 0; i < n; i += 1){ if (!D.kerb[i]) continue; const side = D.curv[i] > 0 ? -1 : 1;
    const a = cen[i], b = cen[(i + 1) % n], nx = NN[i].x * side, nz = NN[i].y * side;
    const k = Math.floor(i / 3) % 2 ? "ink" : "paper";
    const g = new THREE.BoxGeometry(0.04, 0.012, 0.1); const ang = Math.atan2(b.y - a.y, b.x - a.x);
    g.rotateY(-ang); g.translate(a.x + nx * (hw + 0.055), 0.016, a.y + nz * (hw + 0.055)); geos[k].push(g); }
  for (const k in geos) if (geos[k].length){ const m = new THREE.Mesh(mergeGeometries(geos[k]), basic(k === "ink" ? C.char : C.card)); S.add(m); } }
// start line and gantry
{ const a = cen[0], b = cen[3]; const ang = Math.atan2(b.y - a.y, b.x - a.x);
  for (let k = -4; k < 4; k++) for (let r = 0; r < 2; r++) if ((k + r) % 2 === 0){
    const g = new THREE.PlaneGeometry(0.08, 0.08); g.rotateX(-Math.PI/2); g.rotateY(-ang);
    const m = new THREE.Mesh(g, basic(C.ink)); m.position.set(a.x + NN[0].x*(k+.5)*0.08 + Math.cos(ang)*(r-.5)*.08, 0.02, a.y + NN[0].y*(k+.5)*0.08 + Math.sin(ang)*(r-.5)*.08); S.add(m); }
  const grp = new THREE.Group(); grp.position.set(a.x, 0, a.y); grp.rotation.y = -ang; S.add(grp);
  for (const s of [-1, 1]) add(new THREE.BoxGeometry(0.06, 0.62, 0.06), C.card, 0, 0.31, s*(hw + 0.16), {parent: grp, edge: true});
  add(new THREE.BoxGeometry(0.1, 0.14, hw*2 + 0.44), C.card, 0, 0.66, 0, {parent: grp, edge: true});
  for (let k = 0; k < 6; k++) add(new THREE.BoxGeometry(0.104, 0.06, 0.06), C.ink, 0, 0.69, -hw - 0.15 + k*(hw*2+0.3)/5, {parent: grp, cast:false}); }

/* ---------------- props: grandstand on the main straight, tyre walls at the hairpin, cones, trees */
{ const i0 = D.stand.i, sd = D.stand.side, a = cen[i0], b = cen[(i0 + 40) % n], im = (i0 + 20) % n, ang = Math.atan2(b.y - a.y, b.x - a.x);
  const grp = new THREE.Group(); grp.position.set((a.x + b.x)/2 + sd*NN[im].x*(hw+0.62), 0, (a.y + b.y)/2 + sd*NN[im].y*(hw+0.62)); grp.rotation.y = -ang + (sd > 0 ? Math.PI : 0); S.add(grp);
  for (let s = 0; s < 4; s++) add(new THREE.BoxGeometry(2.2, 0.12 + s*0.12, 0.18), s % 2 ? C.card : C.pd, 0, (0.12 + s*0.12)/2, -0.27 + s*0.18, {parent: grp, edge: true});
  add(new THREE.BoxGeometry(2.3, 0.035, 0.62), C.card, 0, 0.7, 0.08, {parent: grp, edge: true});
  for (const x of [-1.05, 0, 1.05]) add(new THREE.BoxGeometry(0.04, 0.7, 0.04), C.card, x, 0.35, 0.36, {parent: grp, edge: true});
  // spectators: small paper and ash dots
  for (let s = 0; s < 4; s++) for (let k = 0; k < 22; k++) if (rnd() > .25) add(new THREE.SphereGeometry(0.03, 6, 4), rnd() > .85 ? C.ash2 : C.card, -1.0 + k*0.095, 0.24 + s*0.12, -0.27 + s*0.18, {parent: grp, cast:false}); }
// tyre walls and cones around the sharpest bend
const bp = D.bend;
for (let dk = -40; dk <= 40; dk += 3){ const i = (bp + dk + n) % n, side = D.curv[i] > 0 ? -1 : 1;
  const x = cen[i].x + NN[i].x * side * (hw + 0.2), z = cen[i].y + NN[i].y * side * (hw + 0.2);
  for (let h = 0; h < 2; h++) add(new THREE.CylinderGeometry(0.045, 0.045, 0.035, 14), "dark", x, 0.018 + h*0.036, z, {edge:true}); }

  const x = cen[i].x + NN[i].x * side * (hw + 0.14), z = cen[i].y + NN[i].y * side * (hw + 0.14);
  const c = iconModel(CONE, 0.06); c.root.position.set(x, 0, z); S.add(c.root); }
function tree(x, z, s){
  const h = 0.12*s; add(new THREE.CylinderGeometry(0.018*s, 0.024*s, h, 6), C.trunk, x, h/2, z);
  const tones = [C.ash, "#c4b9a6", C.ash2, "#d3c9b7"]; const tone = tones[Math.floor(rnd()*tones.length)];
  for (let k = 0; k < 3; k++){ const r = (0.17 - k*0.04)*s, y = h + 0.08*s + k*0.13*s;

for (let k = 0; k < Math.round(900 * SW * SD / (18 * 10.5)); k++){ const x = (rnd() - .5) * (SW - 0.6), z = (rnd() - .5) * (SD - 0.6) + 0.1; const d = distToTrack(x, z);

  if (rnd() > 0.35) tree(x, z, 0.7 + rnd()*0.8); else bush(x, z, 0.8 + rnd()*0.7); }

/* ---------------- cars (the same build as the 3D icon car: body, cabin, wheels; one ember thing) */
// joints, as defined in icons3d.CAR_JOINTS
function poseCar(c, j){
  c.parts.body.rotation.set(j.roll, 0, -j.pitch, "XZY");
  for (const w of ["wheel_fl", "wheel_fr", "wheel_rl", "wheel_rr"]){ const p = c.parts[w]; p.rotation.set(0, w[6] === "f" ? j.steer : 0, -j.spin, "YZX"); }
}
function car(hot){ const c = iconModel(CAR, 0.21, hot ? {} : {ember: "body"}); S.add(c.root); return c; }
const cars = {}; for (const k of ORDER) cars[k] = car(k === HOT);

/* ---------------- run state at time t */
function at(r, t){
  if (t >= r.lap) t = r.lap - 1e-3;
  let lo = 0, hi = r.t.length - 1; while (hi - lo > 1){ const m = (lo+hi)>>1; if (r.t[m] <= t) lo = m; else hi = m; }

  let h0 = r.head[lo], h1 = r.head[hi]; if (h1 - h0 > Math.PI) h1 -= 2*Math.PI; if (h0 - h1 > Math.PI) h1 += 2*Math.PI;
  return {i: lo, x: X(L("x")), z: Z(L("y")), head: h0 + (h1 - h0)*a, slip: L("slip"), v: L("v"), steer: L("steer"), prog: L("prog")};
}
// the crash: the first off-track event (the ember run's first, else any run's); none -> no hit-stop, no sparks
const CR = D.crash ? D.runs[D.crash.run] : null, hp = D.crash ? D.crash.i : 0;
const hitT = CR ? CR.t[hp] : 1e9;
const gameTime = t => t < hitT ? t : t < hitT + 0.08 ? hitT : t - 0.08;   // hit-stop: everything holds 80 ms at the impact
// when the leader reached a given progress (for the gaps in the order tower)
function timeAtProg(r, p){ let lo = 0, hi = r.prog.length - 1; if (p >= r.prog[hi]) return r.t[hi];
  while (hi - lo > 1){ const m = (lo+hi)>>1; if (r.prog[m] < p) lo = m; else hi = m; } return r.t[hi]; }

/* ---------------- tyre marks, dust and sparks: drawn from the history, so any frame can be rendered alone */
const markMat = new THREE.MeshBasicMaterial({color: C.char, transparent: true, opacity: .16, depthWrite: false});
const markHot = new THREE.MeshBasicMaterial({color: C.char, transparent: true, opacity: .32, depthWrite: false});
let fx = new THREE.Group(); S.add(fx);
const puffGeo = new THREE.IcosahedronGeometry(1, 0);
const sparkMat = new THREE.MeshBasicMaterial({color: C.ember});
function effects(gt){
  S.remove(fx); fx.traverse(o => o.geometry && o.geometry !== puffGeo && o.geometry.dispose()); fx = new THREE.Group(); S.add(fx);
  for (const k of ORDER){ const r = D.runs[k], s = at(r, gt); const soft = [], hard = [];
    for (let i = 2; i <= s.i; i += 2){ const sl = Math.abs(r.slip[i]); if (sl < 0.08) continue;
      for (const side of [-1, 1]){ const P = (j) => { const h = r.head[j] + r.slip[j], x = X(r.x[j]) - Math.cos(h)*0.12 - Math.sin(h)*0.08*side, z = Z(r.y[j]) - Math.sin(h)*0.12 + Math.cos(h)*0.08*side; return [x, z]; };
        const [x0, z0] = P(i - 2), [x1, z1] = P(i); const g = new THREE.PlaneGeometry(Math.hypot(x1-x0, z1-z0) + 0.004, 0.022);
        g.rotateX(-Math.PI/2); g.rotateY(-Math.atan2(z1 - z0, x1 - x0)); g.translate((x0+x1)/2, 0.034, (z0+z1)/2); (sl > 0.22 ? hard : soft).push(g); } }
    if (soft.length) fx.add(new THREE.Mesh(mergeGeometries(soft), markMat)); if (hard.length) fx.add(new THREE.Mesh(mergeGeometries(hard), markHot));
    // dust: puffs from the last 0.5 s where the car slid
    for (let i = Math.max(2, s.i - 60); i <= s.i; i += 3){ const age = gt - r.t[i]; if (age < 0 || age > 0.5 || Math.abs(r.slip[i]) < 0.18) continue;
      const q = age / 0.5, h = r.head[i], m = new THREE.Mesh(puffGeo, iconMat("body", Math.round((0.8 * (1 - q)) * 10) / 10)); const sc = 0.03 + q * 0.07; m.scale.set(sc, sc*0.7, sc);
      const j1 = Math.sin(i*12.9898)*43758.5453 % 1, j2 = Math.sin(i*78.233)*12345.678 % 1;
      m.position.set(X(r.x[i]) - Math.cos(h)*0.18 + j1*.03, 0.03 + q*0.06, Z(r.y[i]) - Math.sin(h)*0.18 + j2*.03); fx.add(m); } }
  // crash: ember sparks fly out and fall for 0.5 s, then a mark stays on the barrier
  if (!CR) return;
  const r = CR, age = gt - hitT, px = X(r.x[hp]), pz = Z(r.y[hp]);
  if (age >= 0 && age < 0.55){ for (let k = 0; k < 16; k++){ const a = k / 16 * Math.PI * 2 + 0.3, sp = 0.5 + (k % 4) * 0.18;
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.018, 0.05), sparkMat);
      m.position.set(px + Math.cos(a)*sp*age, 0.05 + 1.1*age - 3.2*age*age, pz + Math.sin(a)*sp*age); m.lookAt(px, 0.05, pz); fx.add(m); } }
  if (age >= 0){ const g = new THREE.RingGeometry(0.05, 0.07, 24); g.rotateX(-Math.PI/2); const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({color: C.ember})); m.position.set(px, 0.025, pz); fx.add(m); }
}

/* ---------------- HUD */
const clock = t => { const m = Math.floor(t/60), s = t - 60*m; return `${m}:${s.toFixed(1).padStart(4, "0")}`; };
function hud(gt){
  document.getElementById("railL").textContent = D.meta.railL;
  document.getElementById("railR").textContent = D.meta.railR;
  document.getElementById("bigL").textContent = D.meta.big;
  const H0 = D.runs[HOT];
  document.getElementById("lap").textContent = gt >= H0.lap && !H0.finished ? "DNF" : clock(Math.min(gt, H0.lap));
  // order by progress along the track; finished runs by lap time; gap = how long ago the leader was here
  const st = ORDER.map(k => { const r = D.runs[k], s = at(r, gt), done = gt >= r.lap;
    return {k, r, s, done, p: done && r.finished ? 1e9 - r.lap : s.prog}; }).sort((a, b) => b.p - a.p);
  const lead = st[0];
  document.getElementById("tower").innerHTML = `<div class="h"><span>Order</span><span>Gap · off</span></div>` + st.map((e, j) => {
    const gap = e.done && !e.r.finished ? "DNF" : j === 0 ? clock(Math.min(gt, e.r.lap))
      : "+" + Math.max(0, Math.min(gt, e.r.lap) - timeAtProg(lead.r, e.s.prog)).toFixed(1) + " s";
    const hits = e.r.hits.filter(i => e.r.t[i] <= gt).length;
    return `<div class="row ${e.k === HOT ? "hot" : ""}"><span class="n">${j+1}</span><span style="font-weight:${e.k === HOT ? 700 : 500}">${e.r.name}</span><span class="g">${gap}</span><span class="x ${hits ? "on" : ""}">${hits}</span></div>`; }).join("");
  let tags = "";
  for (const k of ORDER){ const c = cars[k].root, v = new THREE.Vector3(c.position.x, 0.42, c.position.z).project(cam);
    if (v.z > 1) continue; tags += `<div class="tag ${k === HOT ? "hot" : ""}" style="left:${((v.x+1)/2*W).toFixed(1)}px;top:${((1-v.y)/2*H).toFixed(1)}px">${TAG[k]}</div>`; }
  document.getElementById("tags").innerHTML = tags;
}

/* ---------------- camera: a slow wide shot, or follow the main car with a smoothed lag */
const camState = {p: new THREE.Vector3(), l: new THREE.Vector3(), init: false};
function shadowAround(x, z, half){
  const tex = 2 * half / 4096 * 8; x = Math.round(x / tex) * tex; z = Math.round(z / tex) * tex;
  sun.target.position.set(x, 0, z); sun.position.set(x + ICON_L.x*12, ICON_L.y*12, z + ICON_L.z*12); S.add(sun.target);
  Object.assign(sun.shadow.camera, {left:-half, right:half, top:half, bottom:-half}); sun.shadow.camera.updateProjectionMatrix();
}
function placeCamera(mode, gt){
  if (mode === "crash" && CR){ const r = CR, px = X(r.x[hp]), pz = Z(r.y[hp]); cam.fov = 28; cam.updateProjectionMatrix();
    cam.position.set(px - 2.2, 2.6, pz + 3.0); cam.lookAt(px - 0.5, 0, pz + 0.25); shadowAround(px - 0.5, pz + 0.3, 3.2); return; }
  if (mode === "wide"){ shadowAround(0, 0.2, 10.5 * KS); cam.fov = 26; cam.updateProjectionMatrix(); const a = -0.35 + gt*0.012; cam.position.set(Math.sin(a)*2.5*KS, 15.5*KS, (17.5 + Math.cos(a))*KS); cam.lookAt(0, 0, 0.6); return; }
  cam.fov = 30; cam.updateProjectionMatrix();
  const c = followCam(gt); cam.position.copy(c.pos); cam.lookAt(c.look); shadowAround(c.look.x, c.look.z, 3.4);
}
// Chase camera on a critically damped spring (like a Cinemachine follow camera): it chases a point averaged over the car's
// path from 0.3 s behind to 0.5 s ahead, and turns with the road's direction over ±0.5 s, not with the car's slides.
// The spring is integrated from the start of the shot, so any frame can still be rendered on its own.
function desired(t){
  const r = D.runs[HOT]; let x = 0, z = 0, n = 0;
  for (let k = -3; k <= 5; k++){ const s = at(r, Math.max(0, t + k * 0.1)); x += s.x; z += s.z; n++; }
  const a = at(r, Math.max(0, t - 0.5)), b = at(r, t + 0.5);
  return {x: x / n, z: z / n, yaw: Math.atan2(b.z - a.z, b.x - a.x)};
}
function followCam(t){
  const T0 = (window.SHOT0 ?? Math.max(0, t - 2)), dt = 1 / 120;
  const w = 3.2, wy = 1.6;                                       // stiffness: position, then turning (lower = calmer)
  let d = desired(T0), px = d.x, pz = d.z, vx = 0, vz = 0, yaw = d.yaw, vy = 0;
  for (let u = T0; u < t; u += dt){
    d = desired(u);
    let dy = d.yaw - yaw; while (dy > Math.PI) dy -= 2 * Math.PI; while (dy < -Math.PI) dy += 2 * Math.PI;
    // feed-forward: aim where the target will be after the spring's own lag (2/w), so the car stays in frame
    const d2 = desired(u + 0.05), fx = d.x + (d2.x - d.x) / 0.05 * (2 / w), fz = d.z + (d2.z - d.z) / 0.05 * (2 / w);
    vx += (w * w * (fx - px) - 2 * w * vx) * dt; px += vx * dt;
    vz += (w * w * (fz - pz) - 2 * w * vz) * dt; pz += vz * dt;
    vy += (wy * wy * dy - 2 * wy * vy) * dt; yaw += vy * dt;
  }
  const look = new THREE.Vector3(px, 0, pz);
  const pos = new THREE.Vector3(px - Math.cos(yaw) * 2.4, 3.3, pz - Math.sin(yaw) * 2.4 + 1.6);
  return {pos, look};
}

window.frame = (mode, t) => {
  const gt = gameTime(t);
  for (const k of ORDER){ const r = D.runs[k], s = at(r, gt), s0 = at(r, Math.max(0, gt - 0.05)), c = cars[k];
    c.root.position.set(s.x, 0, s.z); c.root.rotation.set(0, -(s.head + s.slip), 0);
    // the simulation drives the icon's joints: steer from the bend, spin from distance, lean from the slide, dive from braking
    // front wheels follow the logged steering action (positive = right)
    const acc = (s.v - s0.v) / 0.05;
    poseCar(c, {steer: Math.max(-0.5, Math.min(0.5, -s.steer * 0.45)) + s.slip * 0.6, spin: -(r.t[s.i] ? gt * s.v / 100 / 0.22 / 0.21 * 0.21 : 0),
                roll: -s.slip * 0.22, pitch: Math.max(-0.06, Math.min(0.06, -acc / 9000))}); }
  effects(gt); placeCamera(mode, gt); R.render(S, cam); hud(gt);
  return true;
};
window.READY = true;

// Live mode: plays in real time in a browser (not when a renderer drives frame() for video)
if (!navigator.webdriver){
  const ctl = document.getElementById("ctl"); ctl.style.display = "flex";
  const END = Math.max(...ORDER.map(k => D.runs[k].lap)) + 1.2;
  let mode = "follow", t = 0, playing = true, last = performance.now();
  window.SHOT0 = 0;
  const setMode = m => { mode = m; window.SHOT0 = t; ctl.querySelectorAll("[data-m]").forEach(b => b.classList.toggle("on", b.dataset.m === m));
    if (m === "crash" && CR){ t = Math.max(0, hitT - 1.2); window.SHOT0 = t; } };
  if (!CR) ctl.querySelector('[data-m="crash"]').style.display = "none";
  ctl.querySelectorAll("[data-m]").forEach(b => b.onclick = () => setMode(b.dataset.m));
  const pp = document.getElementById("pp"), sc = document.getElementById("scrub");
  pp.onclick = () => { playing = !playing; pp.textContent = playing ? "Pause" : "Play"; };
  sc.oninput = () => { t = sc.value / 1000 * END; window.SHOT0 = Math.max(0, t - 1.5); };
  addEventListener("resize", () => { W = innerWidth; H = innerHeight; R.setSize(W, H); cam.aspect = W / H; cam.updateProjectionMatrix(); });
  const loop = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (playing){ t += dt; if (t > END){ t = 0; window.SHOT0 = 0; } if (mode === "crash" && t > hitT + 1.6){ t = Math.max(0, hitT - 1.2); window.SHOT0 = t; } }
    sc.value = Math.round(t / END * 1000);
    frame(mode, t); requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body></html>
