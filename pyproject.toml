[project]
name = "cars"
version = "0.1.0"
description = "CarRacing research infrastructure for planning with uncertain road geometry"
requires-python = ">=3.12"
dependencies = [
    "gymnasium[box2d]>=1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=2.2,<3",
    "pytest>=9.1.1",
    "rliable>=1.2.0",
    "stable-baselines3>=2.9.0",
    "swig>=4.5.1",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cars"]

[dependency-groups]
dev = []
